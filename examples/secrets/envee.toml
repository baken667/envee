# Secrets example: pull from plugin-resolved stores.
#
# Each `_.secret.<NAME>` references a source plugin. You need the
# corresponding plugin binary in $PATH:
#
#   brew install baken/tap/envee-plugin-op      # 1Password
#   brew install baken/tap/envee-plugin-aws     # AWS
#   brew install baken/tap/envee-plugin-vault   # HashiCorp Vault
#   brew install baken/tap/envee-plugin-env     # Local key-value store
#
# For the local "env" store, use:
#   envee secret set DATABASE_PASSWORD=hunter2
#   envee secret set GITHUB_TOKEN=ghp_xxx

schema = "envee/v1"
profile = "dev"

[env]
SERVICE_NAME = "myapp"

# Local env store (envee-plugin-env). Try it first since no external
# services are required.
DATABASE_PASSWORD = { source = "env", ref = "DATABASE_PASSWORD", redact = true, required = true }
GITHUB_TOKEN = { source = "env", ref = "GITHUB_TOKEN", redact = true }
AWS_DB_CREDS = { source = "env", ref = "AWS_DB_CREDS", redact = true }

# 1Password examples (require envee-plugin-op installed):
# DATABASE_PASSWORD = { source = "op", ref = "op://Dev/Database/password", redact = true, required = true }
# GITHUB_TOKEN = { source = "op", ref = "op://Personal/GitHub/token", redact = true }

# AWS examples (require envee-plugin-aws installed):
# AWS_DB_CREDS = { source = "aws", ref = "secretsmanager/dev/database", redact = true }

# HashiCorp Vault (require envee-plugin-vault installed):
# VAULT_TOKEN = { source = "vault", ref = "secret/data/dev#token", redact = true }

# OS keyring (no external service; no plugin needed for read but
# requires a separate "keyring" plugin for write in the future):
# LOCAL_API_KEY = { source = "keyring", ref = "LOCAL_API_KEY", redact = true }

# Mix: a static value (redact it from `envee status`)
STATIC_API_KEY = { value = "hardcoded-but-redactable", redact = true }
