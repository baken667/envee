# Secrets example: pull from 1Password / AWS / Vault.
#
# Each `_.secret.<NAME>` references a source plugin. You need the
# corresponding plugin binary in $PATH:
#
#   brew install baken/tap/envee-plugin-op
#   brew install baken/tap/envee-plugin-aws
#   brew install baken/tap/envee-plugin-vault

schema = "envee/v1"
profile = "dev"

[env]
SERVICE_NAME = "myapp"

# 1Password: a dev vault secret.
DATABASE_PASSWORD = { source = "op", ref = "op://Dev/Database/password", redact = true, required = true }

# 1Password with full options.
GITHUB_TOKEN = {
  source = "op",
  ref = "op://Personal/GitHub/token",
  account = "my.1password.com",
  vault = "Personal",
  redact = true,
}

# AWS Secrets Manager
AWS_DB_CREDS = {
  source = "aws",
  ref = "secretsmanager/dev/database",
  profile = "default",
  redact = true,
}

# HashiCorp Vault
VAULT_TOKEN = {
  source = "vault",
  ref = "secret/data/dev#token",
  redact = true,
}

# OS keyring (no external service needed; set with `envee secret set`)
LOCAL_API_KEY = { source = "keyring", ref = "LOCAL_API_KEY", redact = true }

# Mix: a static value (redact it from `envee status`)
STATIC_API_KEY = { value = "hardcoded-but-redactable", redact = true }
