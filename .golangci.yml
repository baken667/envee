# golangci-lint configuration for envee (schema v2).
#
# v2 is what `brew install golangci-lint` provides today, and v1 is
# end-of-life. The v1 schema this file used to carry made the linter refuse to
# start ("unsupported version of the configuration"), so `make lint` was
# broken for anyone who installed the tool normally.

version: "2"

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused --
  # exactly the previous enable: list. gosimple is absent because v2 merged
  # it (and stylecheck) into staticcheck; naming it here is a hard error.
  default: standard

  settings:
    errcheck:
      check-blank: false
      check-type-assertions: false
      # Go idioms where the returned error carries no action: best-effort
      # cleanup in defer, and writes to a terminal.
      #
      # These are fully-qualified names, NOT regexes. The old config listed
      # `fmt:.*`, which silently matched nothing, and used pointer receivers
      # for net.Listener/net.Conn, which are interfaces and have no pointer
      # method set -- so those exclusions never applied either.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (*os.File).WriteString
        - (net.Listener).Close
        - (net.Conn).Close
        - os.Remove
        - os.RemoveAll

    staticcheck:
      # SA1019 is "use of a deprecated identifier", which fires on transitive
      # calls into dependencies. In v2 this list also governs the checks that
      # used to live in gosimple (S1xxx) and stylecheck (ST1xxx).
      checks:
        - all
        - -SA1019

    govet:
      # fieldalignment is a padding micro-optimisation: noisy, subjective and
      # unrelated to correctness. Everything else is on.
      enable-all: true
      disable:
        - fieldalignment

  exclusions:
    generated: lax
    # v1 applied a default exclusion set implicitly. In v2 those became named
    # presets; without them the migration would surface a wave of findings
    # that have nothing to do with any actual change.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
