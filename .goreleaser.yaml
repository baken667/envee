# GoReleaser configuration for envee.
# See https://goreleaser.com for documentation.
#
# This config is what makes envee publishable to Homebrew on every `git tag`.
# Triggered by: .github/workflows/release.yml
#
# Uses GoReleaser v1.x schema (matches goreleaser/goreleaser-action@v5).
# Upgrading to the v6 action (GoReleaser v2.x) would force a migration to
# homebrew_casks (cask DSL); we keep the formula DSL for a familiar
# `brew install baken667/tap/envee` UX. See docs/adr/0014-homebrew-pipeline.md.
version: 1

project_name: envee

# before-hook: decode the base64-encoded COSIGN_KEY secret and write
# it to a file so the signs step can use --key=file://... instead of
# fighting goreleaser's template expansion on the env var.
before:
  hooks:
    - cmd: |
        if [ -n "$COSIGN_KEY" ]; then
          echo "Writing cosign key to /tmp/cosign.key"
          echo -n "$COSIGN_KEY" | base64 -d > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
        fi
        if [ -n "$COSIGN_PASSWORD" ]; then
          echo "Using COSIGN_PASSWORD from env"
        fi

# Primary "core" binary.
builds:
  - id: envee
    main: ./cmd/envee
    binary: envee
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/baken667/envee/internal/version.Version={{.Version}}
      - -X github.com/baken667/envee/internal/version.Commit={{.ShortCommit}}
      - -X github.com/baken667/envee/internal/version.Date={{.Date}}
      # Note: .GoVersion template var was removed in goreleaser v1.18+.
      # Use the default "unknown" for the GoVersion field, or set it via
      # `go env GOVERSION` in a before-hook if we ever need it.

  # Long-running daemon companion.
  - id: enveed
    main: ./cmd/enveed
    binary: enveed
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/baken667/envee/internal/version.Version={{.Version}}
      - -X github.com/baken667/envee/internal/version.Commit={{.ShortCommit}}
      - -X github.com/baken667/envee/internal/version.Date={{.Date}}
      # Note: .GoVersion template var was removed in goreleaser v1.18+.

archives:
  - id: envee-archive
    builds:
      - envee
      - enveed
    # The enveed daemon is not built for windows (Linux/macOS only
    # for now — see docs/adr/0003-naming.md / 0012-cross-platform.md).
    # Without this flag, goreleaser refuses to package archives that
    # have a different number of binaries per platform.
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE
      # CHANGELOG.md, completions/* and manpages/* are not in the
      # repo yet (no Cobra setup that auto-generates them, no
      # hand-written manpages). Re-add once we wire up a
      # before-hook that emits them from the cobra command tree.
      # - CHANGELOG.md
      # - completions/*
      # - manpages/*
    format_overrides:
      - goos: windows
        format: zip

# Debian / RedHat / Alpine packages for Linux.
nfpms:
  - id: packages
    package_name: envee
    builds:
      - envee
      - enveed
    formats:
      - deb
      - rpm
      - apk
    maintainer: "Bauyrzhan Akhmetov <baken667@users.noreply.github.com>"
    description: "Per-directory environment variable manager"
    homepage: "https://envee.dev"
    license: "MIT"
    dependencies:
      - bash
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      # TODO: re-add completions/manpages once we wire up a
      # before-hook that emits them. See notes in archives.
      # - src: ./completions/envee.bash
      #   dst: /usr/share/bash-completion/completions/envee
      # - src: ./completions/envee.zsh
      #   dst: /usr/share/zsh/vendor-completions/_envee
      # - src: ./completions/envee.fish
      #   dst: /usr/share/fish/vendor_completions.d/envee.fish
      # - src: ./manpages/*.1
      #   dst: /usr/share/man/man1

# Homebrew formula (pushed to baken667/homebrew-tap on release).
# In v1.x, `repository:` is the tap (replaces deprecated `tap:`).
# The source repository is inferred from the release context.
brews:
  - name: envee
    repository:
      owner: baken667
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://envee.dev"
    description: "Per-directory environment variable manager"
    license: "MIT"
    ids:
      - envee
      - enveed
    directory: Formula
    install: |
      bin.install "envee"
      bin.install "enveed"
      # TODO: re-add shell completions and manpages once we wire up
      # a before-hook that emits them (cobra root.CompletionOptions
      # + a go-md2man-style generator). For now the binary ships
      # without them — users can still drive envee by reading the
      # help output (`envee --help`).
      # bash_completion.install "completions/envee.bash" => "envee"
      # zsh_completion.install "completions/envee.zsh" => "_envee"
      # fish_completion.install "completions/envee.fish"
      # man1.install Dir["manpages/*.1"]
      pkgshare.install "stdlib"
    test: |
      assert_match version.to_s, shell_output("#{bin}/envee --version")
      output = shell_output("#{bin}/envee init bash")
      assert_match "_envee_hook", output
    dependencies: []
    caveats: |
      To enable envee in your shell, add one of these to your config:
        bash:  eval "$(envee init bash)"
        zsh:   eval "$(envee init zsh)"
        fish:  envee init fish | source

# Generate checksums.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Cosign signatures. The key is decoded from the COSIGN_KEY env var
# (base64) to /tmp/cosign.key by the before-hook above, then passed
# to cosign via --key=file://... to avoid the env template quirk
# in goreleaser v1.x (where {{ .Env.X }} fails if the env var is
# only available at process scope, not via the goreleaser context).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    output: true
    env:
      - COSIGN_PASSWORD={{ .Env.COSIGN_PASSWORD }}
    args:
      - sign-blob
      - --key=file:///tmp/cosign.key
      - --output-signature=${signature}
      - ${artifact}

# SBOM (CycloneDX) for supply-chain transparency.
# Disabled for v0.1.0 because the goreleaser-action runner doesn't
# have `syft` installed. Will be re-enabled in a follow-up that also
# installs syft in the release workflow.
# sboms:
#   - id: source-sbom
#     artifacts: source
#   - id: binary-sbom
#     artifacts: binary

# Docker image (multi-arch). v1.x uses dockers + docker_manifests.
dockers:
  - id: docker-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/baken667/envee:{{ .Version }}-amd64"
      - "ghcr.io/baken667/envee:latest-amd64"
    skip_push: false
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=envee"
      - "--label=org.opencontainers.image.description=Per-directory environment variable manager"
      - "--label=org.opencontainers.image.source=https://github.com/baken667/envee"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: docker-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/baken667/envee:{{ .Version }}-arm64"
      - "ghcr.io/baken667/envee:latest-arm64"
    skip_push: false
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=envee"
      - "--label=org.opencontainers.image.description=Per-directory environment variable manager"

docker_manifests:
  - name_template: "ghcr.io/baken667/envee:{{ .Version }}"
    image_templates:
      - "ghcr.io/baken667/envee:{{ .Version }}-amd64"
      - "ghcr.io/baken667/envee:{{ .Version }}-arm64"
  - name_template: "ghcr.io/baken667/envee:latest"
    image_templates:
      - "ghcr.io/baken667/envee:latest-amd64"
      - "ghcr.io/baken667/envee:latest-arm64"

# GitHub release.
release:
  github:
    owner: baken667
    name: envee
  prerelease: auto
  draft: false
  name_template: "v{{.Version}}"
  header: |
    ## envee {{.Version}}
    Released: {{.Date}}
    Commit:  {{.ShortCommit}}

    Install with Homebrew:
      brew install baken667/tap/envee

    Or download a prebuilt binary from the assets below.
  footer: |
    **Full Changelog**: https://github.com/baken667/envee/compare/{{ .PreviousTag }}...{{ .Tag }}

# Conventional-commits changelog.
changelog:
  use: git
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.*$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.*$'
      order: 1
    - title: "🧰 Maintenance"
      regexp: '^.*?(chore|docs|style|refactor|perf|test)(\([[:word:]]+\))??!?:.*$'
      order: 2
    - title: "💥 Breaking Changes"
      regexp: '^.*?(BREAKING CHANGE|breaking)(\([[:word:]]+\))??!?:.*$'
      order: -1
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^chore\(release\):'
