# GoReleaser configuration for envee.
# See https://goreleaser.com for documentation.
#
# This config is what makes envee publishable to Homebrew on every `git tag`.
# Triggered by: .github/workflows/release.yml
#
# Uses GoReleaser v1.x schema (matches goreleaser/goreleaser-action@v5).
# Upgrading to the v6 action (GoReleaser v2.x) would force a migration to
# homebrew_casks (cask DSL); we keep the formula DSL for a familiar
# `brew install baken667/tap/envee` UX. See docs/adr/0014-homebrew-distribution.md.
version: 1

project_name: envee

# Generate the shell completions and man pages that the archives, the Linux
# packages and the Homebrew formula ship. They are not committed -- see
# cmd/gen-docs and the /completions//manpages entries in .gitignore.
before:
  hooks:
    - go run ./cmd/gen-docs completions --output completions/
    - go run ./cmd/gen-docs man --output manpages/

# Primary "core" binary.
builds:
  - id: envee
    main: ./cmd/envee
    binary: envee
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/baken667/envee/internal/version.Version={{.Version}}
      - -X github.com/baken667/envee/internal/version.Commit={{.ShortCommit}}
      - -X github.com/baken667/envee/internal/version.Date={{.Date}}
      # Note: .GoVersion template var was removed in goreleaser v1.18+.
      # Use the default "unknown" for the GoVersion field, or set it via
      # `go env GOVERSION` in a before-hook if we ever need it.

  # Long-running daemon companion.
  - id: enveed
    main: ./cmd/enveed
    binary: enveed
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/baken667/envee/internal/version.Version={{.Version}}
      - -X github.com/baken667/envee/internal/version.Commit={{.ShortCommit}}
      - -X github.com/baken667/envee/internal/version.Date={{.Date}}
      # Note: .GoVersion template var was removed in goreleaser v1.18+.

archives:
  - id: envee-archive
    builds:
      - envee
      - enveed
    # The enveed daemon is not built for windows (Linux/macOS only
    # for now — see docs/adr/0003-naming-files.md / 0012-cross-platform.md).
    # Without this flag, goreleaser refuses to package archives that
    # have a different number of binaries per platform.
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE
      # Produced by the before-hooks above.
      - completions/*
      - manpages/*
    format_overrides:
      - goos: windows
        format: zip

# Debian / RedHat / Alpine packages for Linux.
nfpms:
  - id: packages
    package_name: envee
    builds:
      - envee
      - enveed
    formats:
      - deb
      - rpm
      - apk
    maintainer: "Bauyrzhan Akhmetov <baken667@users.noreply.github.com>"
    description: "Per-directory environment variable manager"
    homepage: "https://envee.bkn.wtf"
    license: "MIT"
    dependencies:
      - bash
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./completions/envee.bash
        dst: /usr/share/bash-completion/completions/envee
      - src: ./completions/envee.zsh
        dst: /usr/share/zsh/vendor-completions/_envee
      - src: ./completions/envee.fish
        dst: /usr/share/fish/vendor_completions.d/envee.fish
      - src: ./manpages/*.1
        dst: /usr/share/man/man1

# Homebrew formula (pushed to baken667/homebrew-tap on release).
# In v1.x, `repository:` is the tap (replaces deprecated `tap:`).
# The source repository is inferred from the release context.
brews:
  - name: envee
    repository:
      owner: baken667
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://envee.bkn.wtf"
    description: "Per-directory environment variable manager"
    license: "MIT"
    # NOTE: in goreleaser v1 `brews.ids` filters ARCHIVE ids, not build ids.
    # Listing the build ids here matched no archive and failed the release
    # with "no linux/macos archives found matching ...".
    ids:
      - envee-archive
    directory: Formula
    install: |
      bin.install "envee"
      bin.install "enveed"
      bash_completion.install "completions/envee.bash" => "envee"
      zsh_completion.install "completions/envee.zsh" => "_envee"
      fish_completion.install "completions/envee.fish"
      man1.install Dir["manpages/*.1"]
    test: |
      assert_match version.to_s, shell_output("#{bin}/envee --version")
      assert_match "_envee_hook", shell_output("#{bin}/envee init bash")
      assert_match "add-zsh-hook", shell_output("#{bin}/envee init zsh")
      assert_match "_envee_hook", shell_output("#{bin}/envee init fish")
    dependencies: []
    caveats: |
      To enable envee in your shell, add one of these to your config:
        bash:  eval "$(envee init bash)"
        zsh:   eval "$(envee init zsh)"
        fish:  envee init fish | source

# Generate checksums.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless cosign signatures (Sigstore).
#
# There is no key material anywhere: cosign exchanges the GitHub Actions OIDC
# token for a short-lived Fulcio certificate and records the signature in the
# public Rekor transparency log. The previous setup carried a base64 private
# key plus its password in repo secrets, and failed on every single release
# because the two had drifted apart.
#
# Requires `permissions: id-token: write` in the workflow and
# sigstore/cosign-installer -- both already present in release.yml.
signs:
  - id: keyless
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    # This field is what makes goreleaser upload the certificate as a release
    # asset. Without it the .pem is written to dist/ and discarded, and
    # keyless verification is then impossible for users.
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      # cosign otherwise prompts on stdin about the transparency log; in a
      # non-TTY CI job that hangs or fails.
      - --yes
      # Pin the ambient credential provider. Left to probe, cosign can fall
      # back to an interactive browser flow.
      - --oidc-provider=github-actions
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

# SBOM for supply-chain transparency.
#
# One SBOM per release archive, so a consumer can inspect exactly what is in
# the artefact they downloaded. syft is installed by the release workflow;
# `goreleaser check` does not verify that it exists, so the CI snapshot build
# is what actually proves this works.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# Docker images are not built for now: envee is a shell-hook tool that reads
# envee.toml from the host cwd and mutates the host shell's environment, so a
# container can do neither, and the dockers: blocks referenced a Dockerfile
# that does not exist in this repo. Reinstate together with a real Dockerfile.

# GitHub release.
release:
  github:
    owner: baken667
    name: envee
  prerelease: auto
  draft: false
  name_template: "v{{.Version}}"
  header: |
    ## envee {{.Version}}
    Released: {{.Date}}
    Commit:  {{.ShortCommit}}

    Install with Homebrew:
      brew install baken667/tap/envee

    Or download a prebuilt binary from the assets below.
  footer: |
    ### Verify this release

    Artifacts are signed keylessly with [Sigstore](https://sigstore.dev) —
    there is no public key to trust. The signature is bound to the GitHub
    Actions workflow that produced it and is recorded in the public Rekor
    transparency log.

    Download `checksums.txt`, `checksums.txt.sig` and `checksums.txt.pem`
    from the assets below, then:

    ```sh
    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      --certificate-identity "https://github.com/baken667/envee/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

    # checksums.txt is now trusted; check your download against it:
    sha256sum --ignore-missing -c checksums.txt
    ```

    **Full Changelog**: https://github.com/baken667/envee/compare/{{ .PreviousTag }}...{{ .Tag }}

# Conventional-commits changelog.
changelog:
  use: git
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.*$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.*$'
      order: 1
    - title: "🧰 Maintenance"
      regexp: '^.*?(chore|docs|style|refactor|perf|test)(\([[:word:]]+\))??!?:.*$'
      order: 2
    - title: "💥 Breaking Changes"
      regexp: '^.*?(BREAKING CHANGE|breaking)(\([[:word:]]+\))??!?:.*$'
      order: -1
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^chore\(release\):'
