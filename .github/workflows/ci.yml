name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.24"

jobs:
  # ---- Test matrix ----------------------------------------------------------

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        include:
          # Run with race detector on one combo only (it's slow)
          - os: ubuntu-latest
            arch: amd64
            race: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: |
          if [ "${{ matrix.race }}" = "true" ]; then
            CGO_ENABLED=1 go test -race -shuffle=on -coverprofile=coverage.out ./...
          else
            go test -shuffle=on ./...
          fi

      - name: Upload coverage (race-only)
        if: matrix.race
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.arch }}
          path: coverage.out

  # ---- Lint ----------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ---- Smoke test of built binary ------------------------------------------

  build-smoke:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/baken667/envee/internal/version.Version=ci" \
            -o ./bin/envee ./cmd/envee
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/baken667/envee/internal/version.Version=ci" \
            -o ./bin/enveed ./cmd/enveed

      - name: Smoke version
        run: ./bin/envee --version

      - name: Smoke help
        run: ./bin/envee --help

      - name: Smoke init bash
        run: |
          out=$(./bin/envee init bash)
          echo "$out" | grep -q "_envee_hook" || (echo "missing hook"; exit 1)
          echo "$out" | grep -q "PROMPT_COMMAND" || (echo "missing PROMPT_COMMAND"; exit 1)

      - name: Smoke init zsh
        run: |
          out=$(./bin/envee init zsh)
          echo "$out" | grep -q "add-zsh-hook" || (echo "missing add-zsh-hook"; exit 1)

      - name: Smoke init fish
        run: |
          out=$(./bin/envee init fish)
          echo "$out" | grep -q "function _envee_hook" || (echo "missing fish hook"; exit 1)

      - name: Smoke discover config
        working-directory: ./examples/basic
        run: |
          ../../bin/envee --config envee.toml check || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: envee-binaries
          path: bin/

  # ---- GoReleaser dry-run --------------------------------------------------

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GoReleaser
        run: |
          curl -sSfL https://git.io/goreleaser | sh -s -- -b /usr/local/bin
      - name: Check
        run: goreleaser check
