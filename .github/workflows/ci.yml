name: CI

on:
  push:
    # staging is the integration branch: work lands there first and is only
    # promoted to main once a release candidate has been exercised.
    branches: [main, staging]
  # No `branches:` filter: a stacked pull request (one whose base is another
  # feature branch) must get checks too.
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install fish, zsh and nushell (Linux)
        # The hook tests run the generated hooks in real shells and skip when
        # a shell is missing; a skipped test looks like a passing one, so at
        # least one platform must have every shell installed and fail here if
        # any is absent.
        if: runner.os == 'Linux'
        run: |
          # The runner image ships third-party apt sources (Chrome, ...) that
          # occasionally serve a broken index; an update failure there must
          # not skip the install of our own packages.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fish zsh
          version=0.115.1
          curl -sSfL -o /tmp/nu.tar.gz \
            "https://github.com/nushell/nushell/releases/download/${version}/nu-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo install "/tmp/nu-${version}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu
          for sh in bash zsh fish nu pwsh; do
            command -v "$sh" >/dev/null || { echo "$sh is not installed; the hook tests would silently skip"; exit 1; }
          done

      - name: zig fmt
        run: zig fmt --check src build.zig

      - name: Build
        run: zig build -Dversion=ci

      - name: Test
        # Windows is build-only for now: the test suite drives POSIX shells
        # and file modes. Cross-compilation for windows is covered below.
        if: runner.os != 'Windows'
        run: zig build test --summary all

      - name: Smoke
        if: runner.os != 'Windows'
        run: |
          ./zig-out/bin/envee version | grep -q "ci" || (echo "build options did not reach the binary"; exit 1)
          ./zig-out/bin/envee --help >/dev/null
          ./zig-out/bin/envee-plugin-env metadata | grep -q '"name":"env"'
          for f in examples/*/envee.toml; do ./zig-out/bin/envee check "$f"; done

      - name: Untrusted eval must be refused
        # The whole point of the trust model. Exit code 3 is "trust required"
        # per docs/adr/0017-error-ux.md.
        if: runner.os != 'Windows'
        working-directory: ./examples/basic
        run: |
          set +e
          ../../zig-out/bin/envee eval bash >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "eval of an untrusted config exited $code, expected 3"
            exit 1
          fi

      - name: Trusted eval exports the expected variables
        if: runner.os != 'Windows'
        working-directory: ./examples/basic
        run: |
          ../../zig-out/bin/envee trust --yes
          out=$(../../zig-out/bin/envee eval bash)
          echo "$out" | grep -q "SERVICE_NAME" || (echo "missing SERVICE_NAME"; exit 1)
          # Values must survive a real shell round trip without executing.
          eval "$out"
          [ "$SERVICE_NAME" = "myapp" ] || (echo "SERVICE_NAME=$SERVICE_NAME"; exit 1)

  release-build:
    name: Release build (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile every release target
        # The same command release.yml runs. A target missing here is a
        # target missing from the release.
        run: zig build release -Dversion=ci -Dcommit=${GITHUB_SHA::7}

      - name: List
        run: find zig-out/release -type f | sort

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: envee-release
          path: zig-out/release/

  sdk-go:
    name: Go plugin SDK
    # pkg/sdk-go is its own module: the SDK for plugin authors stays in Go
    # while the core does not (ADR-0019).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/sdk-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: pkg/sdk-go/go.sum
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -shuffle=on ./...
