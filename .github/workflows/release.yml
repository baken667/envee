name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Build a snapshot release (no publish)"
        required: false
        default: "false"

permissions:
  contents: write # create releases
  id-token: write # keyless cosign signing via Sigstore/Fulcio

jobs:
  release:
    name: Build, sign, and publish
    # A tag like v0.1.1-rc.1 matches this workflow's `v*` filter AND
    # release-staging.yml's `v*-rc.*` filter, so both would run: two jobs
    # racing to create the same GitHub release, with the pre-release pushed
    # to the production tap. GitHub tag filters cannot express negation, so
    # the exclusion has to live here.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        # goreleaser shells out to syft for the per-archive SBOMs. `goreleaser
        # check` does not verify that it exists, so a missing syft would only
        # surface as a failed release.
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        # v5 of the action installs GoReleaser v1.x, which matches the v1
        # schema in .goreleaser.yaml. The v6 action (GoReleaser v2.x) would
        # force a migration to homebrew_casks — see
        # docs/adr/0014-homebrew-distribution.md.
        #
        # Pinned to the same version ci.yml installs for `goreleaser check`,
        # so the PR check and the release cannot drift apart.
        uses: goreleaser/goreleaser-action@v5
        with:
          version: "~> v1.26"
          args: >-
            ${{ inputs.snapshot == 'true'
                && 'release --snapshot --clean --skip=sign,publish,announce'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # No COSIGN_KEY / COSIGN_PASSWORD: signing is keyless and uses the
          # OIDC token granted by `id-token: write` above.
