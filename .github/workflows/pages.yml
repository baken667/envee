name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only the deploy job needs write access; the build job stays read-only.
permissions:
  contents: read

concurrency:
  # Never let two deploys race, but let an in-flight one finish rather than
  # cancelling it mid-publish.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is actually there
        # This job previously checked only for CNAME. A bare `*.html` rule in
        # .gitignore had silently swallowed site/index.html, so the artifact
        # contained the domain marker and no page: Pages served a 404 while
        # every check reported success. Verify the page itself, not just the
        # metadata beside it.
        run: |
          test -f site/index.html || {
            echo "site/index.html is missing from the checkout."
            echo "If it exists locally, it is probably gitignored:"
            echo "  git check-ignore -v site/index.html"
            exit 1
          }
          test -f site/CNAME || { echo "site/CNAME is missing"; exit 1; }
          echo "custom domain: $(cat site/CNAME)"
          echo "page: $(wc -c < site/index.html) bytes"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
